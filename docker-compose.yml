version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecall-postgres
    environment:
      POSTGRES_DB: ecalldb
      POSTGRES_USER: ecall_user
      POSTGRES_PASSWORD: ecall_secret_password
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/db/migration/V1__init_ecall_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecall_user -d ecalldb"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: ecall-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  ecall-orchestrator:
    build: .
    container_name: ecall-orchestrator
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: kafka
      JAVA_OPTS: "-Xms512m -Xmx1024m"
